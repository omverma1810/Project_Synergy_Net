name: CI/CD — Build, Migrate & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: synergy-500111
  REGION: asia-northeast1
  SERVICE_NAME: synergy-api
  REGISTRY: asia-northeast1-docker.pkg.dev
  REPO: synergy-net

jobs:
  # ── Job 1: Deploy Backend to Cloud Run ────────────────────────────────────
  deploy-backend:
    name: Backend → Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    outputs:
      service_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Compute image tags
        id: vars
        run: |
          IMAGE_BASE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPO }}/api"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.vars.outputs.image_tag }}" \
            -t "${{ steps.vars.outputs.image_base }}:latest" \
            -f apps/api/Dockerfile \
            apps/api/

      - name: Push Docker image
        run: |
          docker push "${{ steps.vars.outputs.image_tag }}"
          docker push "${{ steps.vars.outputs.image_base }}:latest"

      - name: Prune old images (keep 5 most recent)
        run: |
          IMAGE_BASE="${{ steps.vars.outputs.image_base }}"
          OLD=$(gcloud artifacts docker images list "${IMAGE_BASE}" \
            --include-tags \
            --sort-by="~UPDATE_TIME" \
            --format="get(version)" \
            2>/dev/null | tail -n +6)
          if [ -n "${OLD}" ]; then
            while IFS= read -r digest; do
              echo "Deleting: ${digest}"
              gcloud artifacts docker images delete "${IMAGE_BASE}@${digest}" \
                --quiet --delete-tags 2>/dev/null || true
            done <<< "${OLD}"
          else
            echo "≤5 images present — nothing to prune"
          fi

      - name: Run database migrations
        run: |
          # Create job on first run; update image on subsequent runs
          gcloud run jobs create migrate-job \
            --image="${{ steps.vars.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --command="sh" \
            --args="release.sh" \
            --set-env-vars="DJANGO_SETTINGS_MODULE=synergy.settings_production,DB_PORT=6543,DB_NAME=postgres,CELERY_TASK_ALWAYS_EAGER=True" \
            --set-secrets="SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,DB_HOST=db-host:latest,DB_USER=db-user:latest,ALLOWED_HOSTS=allowed-hosts:latest,CORS_ALLOWED_ORIGINS=cors-origins:latest" \
            --max-retries=1 \
            --task-timeout=300 \
            2>/dev/null \
          || gcloud run jobs update migrate-job \
            --image="${{ steps.vars.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --command="sh" \
            --args="release.sh" \
            --set-env-vars="DJANGO_SETTINGS_MODULE=synergy.settings_production,DB_PORT=6543,DB_NAME=postgres,CELERY_TASK_ALWAYS_EAGER=True" \
            --set-secrets="SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,DB_HOST=db-host:latest,DB_USER=db-user:latest,ALLOWED_HOSTS=allowed-hosts:latest,CORS_ALLOWED_ORIGINS=cors-origins:latest"

          gcloud run jobs execute migrate-job \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --wait

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          URL=$(gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --image="${{ steps.vars.outputs.image_tag }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="DJANGO_SETTINGS_MODULE=synergy.settings_production,DB_PORT=6543,DB_NAME=postgres,CELERY_TASK_ALWAYS_EAGER=True" \
            --set-secrets="SECRET_KEY=django-secret-key:latest,DB_PASSWORD=db-password:latest,DB_HOST=db-host:latest,DB_USER=db-user:latest,ALLOWED_HOSTS=allowed-hosts:latest,CORS_ALLOWED_ORIGINS=cors-origins:latest" \
            --min-instances=0 \
            --max-instances=10 \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --port=8080 \
            --format="value(status.url)")
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Backend live at: ${URL}"

  # ── Job 2: Deploy Frontend to Vercel (triggered after backend) ────────────
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        # Run from repo root — Vercel project settings already have Root Directory=apps/web
        # so the CLI resolves the correct subdirectory automatically.
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
